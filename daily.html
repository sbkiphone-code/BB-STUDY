<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거의 모든 일상 표현의 영어 - 학습 앱</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card-box, .control-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; }
        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea { height: 90px; resize: vertical; }
        .btn-primary {
            background-color: #6366f1;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: #4f46e5; }
        .btn-secondary {
            background-color: #334155;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-secondary:hover { background-color: #475569; }
        .btn-accent {
            background-color: #0ea5e9;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-accent:hover { background-color: #0284c7; }
        .btn-danger {
            background-color: #ef4444;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .row { display: flex; gap: 10px; }
        .row select { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 망각 곡선 대시보드 -->
        <div class="card-box" style="text-align: center;">
            <div style="font-size: 0.9rem; color: #38bdf8; font-weight: bold; margin-bottom: 5px;">💬 일상회화 영작 학습</div>
            <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">교재 기반 망각곡선 맞춤 회화 트레이닝</div>
            
            <div style="display: flex; justify-content: space-around; margin: 15px 0;">
                <div>
                    <div style="font-size: 0.85rem; color: #94a3b8;">전체 문장</div>
                    <div id="totalCount" style="font-size: 1.8rem; font-weight: bold; color: #38bdf8;">0</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; color: #94a3b8;">오늘 복습 대상</div>
                    <div id="reviewCount" style="font-size: 1.8rem; font-weight: bold; color: #f43f5e;">0</div>
                </div>
            </div>

            <button class="btn-primary" onclick="startDailyReview()">오늘의 전체 회화 복습 시작하기</button>
            <button class="btn-accent" style="margin-top: 10px;" onclick="startUnitReview()">🎯 선택한 유닛만 집중 복습하기</button>
        </div>

        <!-- 챕터별 진도 추가 (JSON 입력) -->
        <div class="control-box">
            <h2>📚 챕터별 진도 추가</h2>
            <div class="row">
                <select id="chapterSelect">
                    <option value="Chapter 1">Chapter 1</option>
                    <option value="Chapter 2">Chapter 2</option>
                    <option value="Chapter 3">Chapter 3</option>
                </select>
                <select id="unitSelect">
                    <option value="Unit 1">Unit 1</option>
                    <option value="Unit 2">Unit 2</option>
                    <option value="Unit 3">Unit 3</option>
                    <option value="Unit 4">Unit 4</option>
                    <option value="Unit 5">Unit 5</option>
                </select>
            </div>
            <textarea id="jsonInput" placeholder="AI가 생성해 준 JSON 코드를 여기에 붙여넣으세요..."></textarea>
            <button class="btn-primary" onclick="importJsonData()">+ AI 소스 붙여넣기 (JSON)</button>
        </div>

        <!-- 데이터 관리 -->
        <div class="control-box">
            <button class="btn-secondary" onclick="exportData()">데이터 백업 (복사)</button>
            <button class="btn-danger" style="margin-top: 10px;" onclick="resetAllData()">전체 데이터 초기화</button>
        </div>
    </div>

    <!-- 학습 진행 영역 -->
    <div id="studyArea" class="card-box" style="display: none; max-width: 500px; width: 100%;">
        <h2 id="studyTitle">학습 진행 중</h2>
        
        <!-- 한글 질문(뜻) 표시 영역 -->
        <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px;">다음 표현의 영어 영작을 떠올려보세요:</div>
        <div id="questionBox" style="font-size: 1.15rem; margin: 10px 0 20px 0; color: #38bdf8; line-height: 1.5; font-weight: bold;">질문 내용</div>
        
        <input type="text" id="answerInput" placeholder="영어 정답을 입력하거나 생각해 보세요" style="margin-bottom: 10px;">
        
        <!-- 정답 확인 버튼 -->
        <button class="btn-primary" id="checkBtn" onclick="checkAnswer()">정답 확인</button>
        
        <!-- 정답 확인 후에 나타나는 영역 -->
        <div id="resultArea" style="display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px;">정답 영어 표현:</div>
            <div id="answerBox" style="font-size: 1.15rem; color: #4ade80; font-weight: bold; margin-bottom: 15px;">정답 내용</div>
            
            <!-- 원어민 발음은 사용자가 직접 클릭했을 때만 재생됨 -->
            <button class="btn-accent" onclick="playPronunciation()" style="margin-bottom: 10px;">🔊 원어민 발음 듣기</button>
            <button class="btn-primary" onclick="nextCard()">다음 문장으로 ➡️</button>
        </div>

        <button class="btn-secondary" style="margin-top: 15px;" onclick="endStudy()">학습 종료</button>
    </div>

    <script>
        let currentQueue = [];
        let currentIndex = 0;

        window.onload = function() {
            updateDashboardStats();
        };

        function getAllCards() {
            return JSON.parse(localStorage.getItem('englishCards') || '[]');
        }

        function updateDashboardStats() {
            const allCards = getAllCards();
            const today = new Date().toISOString().split('T')[0];
            const dueCards = allCards.filter(card => !card.nextReviewDate || card.nextReviewDate <= today);

            document.getElementById('totalCount').innerText = allCards.length;
            document.getElementById('reviewCount').innerText = dueCards.length;
        }

        function importJsonData() {
            const rawText = document.getElementById('jsonInput').value.trim();
            if (!rawText) {
                alert('JSON 데이터를 입력해 주세요.');
                return;
            }

            try {
                const rawData = JSON.parse(rawText);
                const currentChapter = document.getElementById('chapterSelect').value;
                const currentUnit = document.getElementById('unitSelect').value;
                const today = new Date().toISOString().split('T')[0];

                const newCards = rawData.map(item => ({
                    q: item.q,
                    a: item.a,
                    chapter: currentChapter,
                    unit: currentUnit,
                    nextReviewDate: today,
                    interval: 0,
                    repetition: 0
                }));

                let allCards = getAllCards();
                allCards = allCards.concat(newCards);
                localStorage.setItem('englishCards', JSON.stringify(allCards));

                document.getElementById('jsonInput').value = '';
                updateDashboardStats();
                alert(`[${currentChapter} ${currentUnit}]에 ${newCards.length}개의 데이터가 성공적으로 추가되었습니다!`);
            } catch (e) {
                alert('JSON 형식이 올바르지 않습니다. 코드를 다시 확인해 주세요.');
                console.error(e);
            }
        }

        function startDailyReview() {
            const allCards = getAllCards();
            const today = new Date().toISOString().split('T')[0];
            currentQueue = allCards.filter(card => !card.nextReviewDate || card.nextReviewDate <= today);

            if (currentQueue.length === 0) {
                alert('오늘 복습할 대상 문장이 없습니다! 전체 문장으로 학습을 시작합니다.');
                currentQueue = allCards;
            }
            if (currentQueue.length === 0) {
                alert('등록된 데이터가 없습니다. JSON을 먼저 추가해 주세요.');
                return;
            }

            currentIndex = 0;
            showStudyScreen("오늘의 전체 복습");
        }

        function startUnitReview() {
            const allCards = getAllCards();
            const selChapter = document.getElementById('chapterSelect').value;
            const selUnit = document.getElementById('unitSelect').value;

            currentQueue = allCards.filter(card => card.chapter === selChapter && card.unit === selUnit);

            if (currentQueue.length === 0) {
                alert(`[${selChapter} ${selUnit}]에 등록된 데이터가 없습니다.`);
                return;
            }

            currentIndex = 0;
            showStudyScreen(`${selChapter} ${selUnit} 집중 복습`);
        }

        function showStudyScreen(title) {
            document.querySelector('.container').style.display = 'none';
            document.getElementById('studyArea').style.display = 'block';
            document.getElementById('studyTitle').innerText = title;
            loadCard();
        }

        function loadCard() {
            if (currentIndex >= currentQueue.length) {
                alert('모든 학습을 완료했습니다!');
                endStudy();
                return;
            }
            const card = currentQueue[currentIndex];
            document.getElementById('questionBox').innerText = card.q;
            document.getElementById('answerInput').value = '';
            
            // 정답 영역 숨기고 정답 확인 버튼 보이기
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'block';
        }

        // 정답 확인 버튼을 누를 때는 오직 정답만 보여줌 (소리 자동 재생 없음)
        function checkAnswer() {
            const card = currentQueue[currentIndex];
            
            document.getElementById('answerBox').innerText = card.a;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('checkBtn').style.display = 'none';
        }

        // 사용자가 [🔊 원어민 발음 듣기] 버튼을 직접 클릭했을 때만 발음 재생
        function playPronunciation() {
            const card = currentQueue[currentIndex];
            if (!card || !card.a) return;

            const utterance = new SpeechSynthesisUtterance(card.a);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function nextCard() {
            currentIndex++;
            loadCard();
        }

        function endStudy() {
            document.getElementById('studyArea').style.display = 'none';
            document.querySelector('.container').style.display = 'flex';
            window.speechSynthesis.cancel();
            updateDashboardStats();
        }

        function exportData() {
            const dataStr = localStorage.getItem('englishCards') || '[]';
            navigator.clipboard.writeText(dataStr).then(() => {
                alert('전체 데이터가 클립보드에 복사되었습니다!');
            });
        }

        function resetAllData() {
            if (confirm('정말로 모든 데이터를 초기화하시겠습니까?')) {
                localStorage.removeItem('englishCards');
                updateDashboardStats();
                alert('초기화되었습니다.');
            }
        }
    </script>
</body>
</html>
