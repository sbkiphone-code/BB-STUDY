<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거의 모든 일상 표현의 영어 - 학습 앱</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card-box, .control-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; }
        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea { height: 100px; resize: vertical; }
        .btn-primary {
            background-color: #6366f1;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: #4f46e5; }
        .btn-danger {
            background-color: #ef4444;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .row { display: flex; gap: 10px; }
        .row select { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 대시보드 및 학습 시작 -->
        <div class="card-box" style="text-align: center;">
            <h2>일상회화 영작 학습</h2>
            <div style="display: flex; justify-content: space-around; margin: 15px 0;">
                <div>
                    <div style="font-size: 0.85rem; color: #94a3b8;">전체 문장</div>
                    <div id="totalCount" style="font-size: 1.5rem; font-weight: bold; color: #38bdf8;">0</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; color: #94a3b8;">선택 유닛 문장</div>
                    <div id="unitCount" style="font-size: 1.5rem; font-weight: bold; color: #f43f5e;">0</div>
                </div>
            </div>
            <button class="btn-primary" onclick="startStudySession()">선택한 유닛 복습 시작하기</button>
        </div>

        <!-- 챕터별 진도 추가 (JSON 입력) -->
        <div class="control-box">
            <h2>📚 챕터별 진도 추가</h2>
            <div class="row">
                <select id="chapterSelect" onchange="updateUnitCount()">
                    <option value="Chapter 1">Chapter 1</option>
                    <option value="Chapter 2">Chapter 2</option>
                    <option value="Chapter 3">Chapter 3</option>
                </select>
                <select id="unitSelect" onchange="updateUnitCount()">
                    <option value="Unit 1">Unit 1</option>
                    <option value="Unit 2">Unit 2</option>
                    <option value="Unit 3">Unit 3</option>
                    <option value="Unit 4">Unit 4</option>
                    <option value="Unit 5">Unit 5</option>
                </select>
            </div>
            <textarea id="jsonInput" placeholder="AI가 생성해 준 JSON 코드를 여기에 붙여넣으세요..."></textarea>
            <button class="btn-primary" onclick="importJsonData()">+ AI 소스 붙여넣기 (JSON)</button>
        </div>

        <!-- 데이터 관리 -->
        <div class="control-box">
            <button class="btn-primary" style="background-color: #334155;" onclick="alert('준비 중인 기능입니다.')">데이터 백업 (복사)</button>
            <button class="btn-danger" style="margin-top: 10px;" onclick="resetAllData()">전체 데이터 초기화</button>
        </div>
    </div>

    <script>
        // 페이지 로드 시 카운트 업데이트
        window.onload = function() {
            updateUnitCount();
        };

        // 로컬 스토리지에서 전체 데이터 가져오기
        function getAllCards() {
            return JSON.parse(localStorage.getItem('englishCards') || '[]');
        }

        // 현재 선택된 챕터와 유닛의 문장 수 계산 및 화면 갱신
        function updateUnitCount() {
            const allCards = getAllCards();
            const currentChapter = document.getElementById('chapterSelect').value;
            const currentUnit = document.getElementById('unitSelect').value;

            const filtered = allCards.filter(card => card.chapter === currentChapter && card.unit === currentUnit);

            document.getElementById('totalCount').innerText = allCards.length;
            document.getElementById('unitCount').innerText = filtered.length;
        }

        // JSON 데이터 추가 (선택된 챕터·유닛 태그 자동 부여)
        function importJsonData() {
            const rawText = document.getElementById('jsonInput').value.trim();
            if (!rawText) {
                alert('JSON 데이터를 입력해 주세요.');
                return;
            }

            try {
                const rawData = JSON.parse(rawText);
                const currentChapter = document.getElementById('chapterSelect').value;
                const currentUnit = document.getElementById('unitSelect').value;

                // 각 문장 객체에 현재 선택된 챕터와 유닛 정보를 강제로 심어줌
                const newCards = rawData.map(item => ({
                    q: item.q,
                    a: item.a,
                    chapter: currentChapter,
                    unit: currentUnit,
                    nextReviewDate: new Date().toISOString().split('T')[0]
                }));

                let allCards = getAllCards();
                // 기존 데이터에 합치기
                allCards = allCards.concat(newCards);
                localStorage.setItem('englishCards', JSON.stringify(allCards));

                document.getElementById('jsonInput').value = '';
                updateUnitCount();
                alert(`[${currentChapter} ${currentUnit}]에 ${newCards.length}개의 데이터가 성공적으로 추가되었습니다!`);
            } catch (e) {
                alert('JSON 형식이 올바르지 않습니다. 코드를 다시 확인해 주세요.');
                console.error(e);
            }
        }

        // 선택된 유닛의 카드만 필터링하여 학습 시작
        function startStudySession() {
            const allCards = getAllCards();
            const currentChapter = document.getElementById('chapterSelect').value;
            const currentUnit = document.getElementById('unitSelect').value;

            const targetCards = allCards.filter(card => card.chapter === currentChapter && card.unit === currentUnit);

            if (targetCards.length === 0) {
                alert(`[${currentChapter} ${currentUnit}]에 등록된 학습 데이터가 없습니다. 먼저 JSON을 추가해 주세요.`);
                return;
            }

            // 테스트용 알림 (실제 학습 화면 전환 코드로 연결하시면 됩니다)
            alert(`[${currentChapter} ${currentUnit}] 총 ${targetCards.length}개 문장으로 학습을 시작합니다!`);
            console.log("학습 대상 카드 목록:", targetCards);
            // 예: window.location.href = "study.html"; 등 필요에 따라 연결
        }

        // 전체 데이터 초기화
        function resetAllData() {
            if (confirm('정말로 모든 데이터를 초기화하시겠습니까?')) {
                localStorage.removeItem('englishCards');
                updateUnitCount();
                alert('초기화되었습니다.');
            }
        }
    </script>
</body>
</html>
