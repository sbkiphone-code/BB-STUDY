<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>잊기 전에 - 망각곡선 학습 앱</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --inner-card: #334155;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 22px; color: var(--text-main); }
    header p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
    
    .section-card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { background: var(--inner-card); padding: 12px; border-radius: 8px; text-align: center; }
    .stat-box .num { font-size: 20px; font-weight: bold; margin-top: 4px; }
    .stat-box .num.today { color: #f43f5e; }

    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    button { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { opacity: 0.8; }
    button.secondary { background: var(--inner-card); color: var(--text-main); }
    button.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    textarea { width: 100%; height: 180px; background: var(--inner-card); border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 8px; }
    
    .quiz-card { background: var(--inner-card); border-radius: 8px; padding: 20px; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 12px; }
    .quiz-q { font-size: 18px; font-weight: bold; margin-bottom: 10px; white-space: pre-wrap; }
    .quiz-a { font-size: 16px; color: #38bdf8; margin-top: 10px; display: none; white-space: pre-wrap; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .quiz-opt-btn { background: var(--card-bg); text-align: left; padding: 10px 14px; font-weight: normal; }

    .notice-banner { background: rgba(99,102,241,0.15); border: 1px solid var(--accent-color); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-sub); margin-bottom: 16px; }
  </style>
</head>
<body>

  <header>
    <h1>잊기 전에</h1>
    <p>단어 · 한자 · 문법 망각곡선 맞춤 복습</p>
  </header>

  <div id="cleanup-banner"></div>

  <!-- 단어 섹션 -->
  <div class="section-card">
    <div class="section-title">📖 영단어</div>
    <div class="stats-grid">
      <div class="stat-box">전체<div class="num" id="vocab-total">0</div></div>
      <div class="stat-box">오늘 복습<div class="num today" id="vocab-today">0</div></div>
    </div>
    <div class="btn-group">
      <button onclick="startStudy('vocab')">오늘의 복습 시작하기</button>
      <button class="secondary" onclick="startPractice('vocab')">🆕 오늘 새 내용 먼저 보기</button>
    </div>
  </div>

  <!-- 한자 섹션 -->
  <div class="section-card">
    <div class="section-title">⛩️ 생활 한자</div>
    <div class="stats-grid">
      <div class="stat-box">전체<div class="num" id="hanja-total">0</div></div>
      <div class="stat-box">오늘 복습<div class="num today" id="hanja-today">0</div></div>
    </div>
    <div class="btn-group">
      <button onclick="startStudy('hanja')">오늘의 복습 시작하기</button>
      <button class="secondary" onclick="startPractice('hanja')">🆕 오늘 새 내용 먼저 보기</button>
    </div>
  </div>

  <!-- 문법 섹션 -->
  <div class="section-card">
    <div class="section-title">📚 문법 문제</div>
    <div class="stats-grid">
      <div class="stat-box">전체<div class="num" id="grammar-total">0</div></div>
      <div class="stat-box">오늘 복습<div class="num today" id="grammar-today">0</div></div>
    </div>
    <div class="btn-group">
      <button onclick="startStudy('grammar')">오늘의 복습 시작하기</button>
      <button class="secondary" onclick="startPractice('grammar')">🆕 오늘 새 내용 먼저 보기</button>
    </div>
  </div>

  <!-- 데이터 관리 -->
  <div class="section-card">
    <div class="btn-group">
      <button class="secondary" onclick="openModal('add-modal')">+ 매일 데이터 붙여넣기 (JSON)
