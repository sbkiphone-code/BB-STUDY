<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5대 동사 회화 트레이닝</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 6px;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .card-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .stat-value.total { color: #38bdf8; }
        .stat-value.review { color: #f87171; }

        .btn-primary {
            background: #2563eb;
            color: white;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:active { background: #1d4ed8; }

        .progress-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .progress-item span {
            font-size: 0.9rem;
            color: #e2e8f0;
        }
        .btn-add {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add:active { background: #475569; }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            cursor: pointer;
        }

        /* 학습 진행 화면 모달 스타일 */
        #studyModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .study-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .study-q {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .study-a-box {
            display: none;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .study-a {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .btn-tts {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .action-group {
            display: flex;
            gap: 10px;
        }
        .btn-forgot {
            flex: 1;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }
        .btn-remember {
            flex: 1;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>5대 동사 회화 트레이닝</h1>
    <div class="subtitle">버튼만 누르면 단계별 진도가 앱에 자동 추가됩니다</div>

    <!-- 대시보드 메인 카드 -->
    <div class="card-box">
        <div class="section-title">💬 회화 영작 학습</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">전체 문장</div>
                <div id="totalCount" class="stat-value total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">오늘 복습</div>
                <div id="reviewCount" class="stat-value review">0</div>
            </div>
        </div>
        <button class="btn-primary" onclick="startReview()">오늘의 회화 복습 시작하기</button>
    </div>

    <!-- 진도별 문제 추가하기 카드 -->
    <div class="card-box">
        <div class="section-title">📚 진도별 문제 추가하기</div>
        
        <div class="progress-item">
            <span>Take (1) ~ (2) 학습 추가</span>
            <button class="btn-add" onclick="addBatch('take1')">+ 추가</button>
        </div>
        <div class="progress-item">
            <span>Take (3) ~ (4) 학습 추가</span>
            <button class="btn-add" onclick="addBatch('take2')">+ 추가</button>
        </div>
        <div class="progress-item">
            <span>Have (1) ~ (2) 학습 추가</span>
            <button class="btn-add" onclick="addBatch('have1')">+ 추가</button>
        </div>
    </div>

    <!-- 백업 및 초기화 -->
    <button class="btn-secondary" onclick="backupData()">데이터 백업 (복사)</button>
    <button class="btn-danger" onclick="resetData()">전체 데이터 초기화</button>
</div>

<!-- 학습/복습 진행 모달 화면 -->
<div id="studyModal">
    <div class="study-card">
        <div class="study-header">
            <span id="studyProgress">1 / 5</span>
            <span style="cursor: pointer;" onclick="closeStudy()">✕ 닫기</span>
        </div>
        
        <div id="studyQ" class="study-q">질문이 여기에 표시됩니다.</div>
        
        <div id="studyABox" class="study-a-box">
            <div id="studyA" class="study-a">정답이 여기에 표시됩니다.</div>
            <button class="btn-tts" onclick="speakAnswer()">🔊 원어민 발음 듣기</button>
        </div>

        <button id="btnShow" class="btn-primary" onclick="revealAnswer()">정답 보기</button>
        
        <div class="action-group">
            <button id="btnForgot" class="btn-forgot" onclick="handleResult(false)">몰랐어요 (재도전)</button>
            <button id="btnRemember" class="btn-remember" onclick="handleResult(true)">알아요 (통과)</button>
        </div>
    </div>
</div>

<script>
    const INTERVALS = [1, 3, 7, 15, 30]; // 망각곡선 주기 (일)

    // 샘플 데이터 셋 (원하시는 데이터 묶음 정의)
    const sourceData = {
        take1: [
            {"id": 1791787695373.1, "q": "[take (1)] 내일 저를 공항에 데려다 줄 수 있나요?", "a": "Can you take me to the airport tomorrow?", "stage": 0, "nextReview": getTodayString()},
            {"id": 1791787695373.2, "q": "[take (1)] 내가 이 노트북 컴퓨터 가져가도 될까요?", "a": "May I take this laptop computer?", "stage": 0, "nextReview": getTodayString()},
            {"id": 1791787695373.3, "q": "[take (2)] 당신은 항상 사무실까지 계단으로 오나요?", "a": "Do you always take the stairs to the office?", "stage": 0, "nextReview": getTodayString()}
        ],
        take2: [
            {"id": 1791788542997.1, "q": "[Take 심화] 비 오니까 이 우산 가져가세요.", "a": "Take this umbrella because it's raining.", "stage": 0, "nextReview": getTodayString()},
            {"id": 1791788542997.2, "q": "[Take 심화] 내일 아이들을 놀이공원에 데려갈 생각이에요.", "a": "I am planning to take the kids to the amusement park tomorrow.", "stage": 0, "nextReview": getTodayString()}
        ],
        have1: [
            {"id": 1791789000001.1, "q": "[Have (1)] 나 그거 미리 확인했어야 했는데.", "a": "I should have checked that in advance.", "stage": 0, "nextReview": getTodayString()},
            {"id": 1791789000001.2, "q": "[Have (1)] 오늘 오후에 회의가 잡혀 있어요.", "a": "I have a meeting scheduled for this afternoon.", "stage": 0, "nextReview": getTodayString()}
        ]
    };

    let sentences = JSON.parse(localStorage.getItem('englishSentences')) || [];
    let reviewQueue = [];
    let currentIndex = 0;

    function getTodayString() {
        const today = new Date();
        return today.toISOString().split('T')[0];
    }

    function updateDashboard() {
        document.getElementById('totalCount').innerText = sentences.length;
        
        const todayStr = getTodayString();
        const reviewList = sentences.filter(s => s.nextReview <= todayStr);
        document.getElementById('reviewCount').innerText = reviewList.length;
    }

    // 진도별 데이터 추가 함수
    function addBatch(key) {
        const batch = sourceData[key];
        if (!batch) return;

        let addedCount = 0;
        batch.forEach(newItem => {
            // 중복 아이디가 없을 때만 추가
            if (!sentences.some(s => s.q === newItem.q)) {
                sentences.push(JSON.parse(JSON.stringify(newItem)));
                addedCount++;
            }
        });

        localStorage.setItem('englishSentences', JSON.stringify(sentences));
        updateDashboard();
        alert(`${addedCount}개의 문장이 학습 진도에 추가되었습니다!`);
    }

    // 복습 시작
    function startReview() {
        const todayStr = getTodayString();
        reviewQueue = sentences.filter(s => s.nextReview <= todayStr);

        if (reviewQueue.length === 0) {
            alert("오늘 복습할 문장이 없습니다! 진도를 새로 추가하거나 내일 다시 이용해주세요.");
            return;
        }

        currentIndex = 0;
        document.getElementById('studyModal').style.display = 'flex';
        loadStudyCard();
    }

    function closeStudy() {
        document.getElementById('studyModal').style.display = 'none';
        updateDashboard();
    }

    function loadStudyCard() {
        if (currentIndex >= reviewQueue.length) {
            alert("🎉 오늘의 복습을 모두 완료했습니다!");
            closeStudy();
            return;
        }

        const item = reviewQueue[currentIndex];
        document.getElementById('studyProgress').innerText = `${currentIndex + 1} / ${reviewQueue.length}`;
        document.getElementById('studyQ').innerText = item.q;
        document.getElementById('studyA').innerText = item.a;

        document.getElementById('studyABox').style.display = 'none';
        document.getElementById('btnShow').style.display = 'block';
        document.getElementById('btnForgot').style.display = 'none';
        document.getElementById('btnRemember').style.display = 'none';
    }

    function revealAnswer() {
        document.getElementById('studyABox').style.display = 'block';
        document.getElementById('btnShow').style.display = 'none';
        document.getElementById('btnForgot').style.display = 'block';
        document.getElementById('btnRemember').style.display = 'block';

        speakAnswer(); // 정답 공개 시 원어민 발음 자동 재생
    }

    function speakAnswer() {
        const text = document.getElementById('studyA').innerText;
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function handleResult(isRemembered) {
        const currentItem = reviewQueue[currentIndex];
        const target = sentences.find(s => s.id === currentItem.id);
        const today = new Date();

        if (isRemembered) {
            target.stage = Math.min(target.stage + 1, INTERVALS.length - 1);
        } else {
            target.stage = 0;
        }

        const addDays = INTERVALS[target.stage];
        const nextDate = new Date(today);
        nextDate.setDate(today.getDate() + addDays);
        target.nextReview = nextDate.toISOString().split('T')[0];

        localStorage.setItem('englishSentences', JSON.stringify(sentences));

        currentIndex++;
        loadStudyCard();
    }

    function backupData() {
        const dataStr = JSON.stringify(sentences, null, 2);
        navigator.clipboard.writeText(dataStr).then(() => {
            alert("전체 데이터가 클립보드에 복사되었습니다. 메모장에 백업해 두세요!");
        });
    }

    function resetData() {
        if (confirm("정말로 모든 데이터를 초기화하시겠습니까?")) {
            localStorage.removeItem('englishSentences');
            sentences = [];
            updateDashboard();
            alert("초기화되었습니다.");
        }
    }

    // 페이지 로드 시 대시보드 상태 갱신
    window.onload = function() {
        updateDashboard();
    };
</script>

</body>
</html>
